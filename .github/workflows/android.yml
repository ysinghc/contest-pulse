name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IIITU-ACM-ContestPulse-Debug-APK
          path: app/build/outputs/apk/debug/IIITU-ACM-ContestPulse-v1.0-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IIITU-ACM-ContestPulse-Release-APK
          path: app/build/outputs/apk/release/IIITU-ACM-ContestPulse-v1.0-release.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/IIITU-ACM-ContestPulse-v1.0-debug.apk
            app/build/outputs/apk/release/IIITU-ACM-ContestPulse-v1.0-release.apk
          body: |
            ## IIITU ACM ContestPulse Release
            Official release for IIITU ACM Student Chapter.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
